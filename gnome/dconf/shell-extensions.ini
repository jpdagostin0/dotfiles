[dash-to-dock]
apply-custom-theme=false
background-opacity=0.80000000000000004
custom-theme-shrink=false
dash-max-icon-size=48
dock-fixed=false
dock-position='BOTTOM'
height-fraction=0.90000000000000002
hide-delay=0.10000000000000002
icon-size-fixed=false
intellihide=true
intellihide-mode='ALL_WINDOWS'
preferred-monitor=-2
preferred-monitor-by-connector='eDP-1'
preview-size-scale=0.98999999999999999
require-pressure-to-show=false
show-apps-always-in-the-edge=false
show-apps-at-top=true
show-delay=0.050000000000000017
show-mounts=false
show-mounts-network=false
show-mounts-only-mounted=true
show-trash=false

[rounded-windows]
border-alpha=1.0
border-blue=0.94509804248809814
border-green=0.75686275959014893
border-red=0.60000002384185791
border-width=4
corner-radius=15
custom-shadow=false
focused-shadow-spread=6
padding-bottom=0
padding-left=0
padding-right=0
padding-top=0
skip-libadwaita-app=false
smoothing=0.0

[simple-tiling/domoel]
float-window=['<Alt><Shift>space']
focus-down=['<Alt>j']
focus-left=['<Alt>h']
focus-right=['<Alt>l']
focus-up=['<Alt>k']
inner-gap=10
master-ratio=55
monocle-next=['<Alt>period']
monocle-prev=['<Alt>comma']
new-window-behavior='master'
outer-gap-horizontal=5
swap-down-window=['<Alt><Shift>j']
swap-left-window=['<Alt><Shift>h']
swap-master-window=['<Alt>Return']
swap-right-window=['<Alt><Shift>l']
swap-up-window=['<Alt><Shift>k']
toggle-monocle=['<Alt>m', '<Alt>space']
toggle-tiling=['<Alt>t', '<Alt>f']

[space-bar/appearance]
application-styles='.space-bar {\n  -natural-hpadding: 12px;\n}\n\n.space-bar-workspace-label.active {\n  margin: 0 4px;\n  background-color: rgba(255,255,255,0.3);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive.empty {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,0.5);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}'

[user-theme]
name='Catppuccin-Mauve-Dark'

[wack-lockscreen-clock]
clock-animation='slide-up'
enable-unblank=false
lockscreen-mode='wack'
prompt-animation='rise'
